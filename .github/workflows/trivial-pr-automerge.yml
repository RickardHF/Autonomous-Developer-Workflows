name: Auto-merge Approved Trivial PRs

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: trivial-pr-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  classify:
    name: Classify approved changes
    outputs:
      trivial: ${{ steps.classify.outputs.trivial }}
      base_sha: ${{ steps.preflight.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    steps:
      - name: Inspect triggering review and resolve trusted base
        id: preflight
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const event = context.payload;
            const number = event.pull_request?.number;
            const reviewId = event.review?.id;
            const diagnostics = {
              action: event.action, review_id: reviewId, review_state: event.review?.state,
              pr_number: number, event_pr_state: event.pull_request?.state,
              event_pr_draft: event.pull_request?.draft,
              event_source_repository: event.pull_request?.head?.repo?.full_name,
              event_target_branch: event.pull_request?.base?.ref,
            };
            const directory = path.join(process.env.RUNNER_TEMP, "trivial-pr-analysis");
            fs.mkdirSync(directory, { recursive: true });
            fs.writeFileSync(path.join(directory, "preflight.json"),
              JSON.stringify({ ...diagnostics, ready: false, reason: "Preflight did not complete; inspect the job error" }, null, 2));
            const report = async (ready, reason) => {
              fs.writeFileSync(path.join(directory, "preflight.json"), JSON.stringify({ ...diagnostics, ready, reason }, null, 2));
              core.setOutput("ready", String(ready));
              await core.summary.addHeading(ready ? "Review event: collecting changes" : "Ineligible review event")
                .addCodeBlock(JSON.stringify({ ...diagnostics, reason }, null, 2), "json").write();
            };
            if (event.action !== "submitted" || typeof event.review?.state !== "string" ||
                event.review.state.toLowerCase() !== "approved") {
              await report(false, "Not a submitted approval");
              return;
            }
            if (!Number.isSafeInteger(number) || number < 1 || !Number.isSafeInteger(reviewId) || reviewId < 1) {
              throw new Error("Invalid PR or review number");
            }
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.number !== number) throw new Error("GitHub returned a different PR");
            if (pr.base?.ref !== "main" || pr.base?.repo?.full_name !== process.env.GITHUB_REPOSITORY) {
              await report(false, "PR does not target this repository's main branch");
              return;
            }
            if (!/^[a-f0-9]{40}$/.test(pr.base.sha)) throw new Error("Invalid trusted base revision");
            core.setOutput("base_sha", pr.base.sha);
            await report(true, "Trusted base resolved; checking the complete PR and triggering review through GitHub's API");

      - name: Checkout trusted base, never candidate code
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect complete change snapshot
        id: snapshot
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { collectSnapshot } = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/trivial-pr-automerge.cjs"));
            const directory = path.join(process.env.RUNNER_TEMP, "trivial-pr-analysis");
            const snapshot = await collectSnapshot({
              github, event: context.payload, repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID, cwd: process.env.GITHUB_WORKSPACE,
            });
            fs.mkdirSync("out/trivial-pr-automerge", { recursive: true });
            fs.writeFileSync("out/trivial-pr-automerge/snapshot.json", JSON.stringify(snapshot, null, 2));
            fs.writeFileSync(path.join(directory, "snapshot.json"), JSON.stringify(snapshot, null, 2));
            core.setOutput("eligible", String(snapshot.eligible));
            await core.summary.addHeading("Review-triggered PR assessment")
              .addCodeBlock(snapshot.reason).write();

      - name: Install Copilot CLI
        if: steps.snapshot.outputs.eligible == 'true'
        uses: ./.github/actions/setup-copilot-cli

      - name: Classify changes with read-only Copilot
        id: classify
        if: steps.snapshot.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { classifySnapshot } = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/trivial-pr-automerge.cjs"));
            const snapshotPath = path.join(process.env.GITHUB_WORKSPACE, "out/trivial-pr-automerge/snapshot.json");
            const directory = path.join(process.env.RUNNER_TEMP, "trivial-pr-analysis");
            const decision = await classifySnapshot({
              github, event: context.payload, repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID, snapshot: JSON.parse(fs.readFileSync(snapshotPath, "utf8")),
              snapshotPath, cwd: process.env.GITHUB_WORKSPACE,
              onOutput: (raw) => fs.writeFileSync(path.join(directory, "copilot-output.txt"), raw),
            });
            fs.writeFileSync(path.join(directory, "decision.json"), JSON.stringify(decision, null, 2));
            core.setOutput("trivial", String(decision.status === "complete" && decision.trivial === true));
            await core.summary.addHeading(decision.status === "stale" ? "Stale: assessment withheld" :
              decision.trivial ? "Trivial: checking guarded merge readiness" : "Nontrivial: no merge")
              .addCodeBlock(JSON.stringify(decision, null, 2), "json").write();

      - name: Report incomplete classification
        if: failure()
        run: echo "Classification did not complete. No merge is authorized; inspect the job error and snapshot." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivial-pr-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/trivial-pr-analysis/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Guarded squash merge and cleanup
    needs: classify
    if: needs.classify.result == 'success' && needs.classify.outputs.trivial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Checkout analyzed trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.base_sha }}
          persist-credentials: false

      - name: Download this run's analysis evidence
        uses: actions/download-artifact@v8
        with:
          name: trivial-pr-analysis-${{ github.run_id }}
          path: out/trivial-pr-automerge

      - name: Wait for required checks and squash merge the exact head
        id: merge
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { mergeIfReady } = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/trivial-pr-automerge.cjs"));
            const directory = "out/trivial-pr-automerge";
            const result = await mergeIfReady({
              github, event: context.payload, repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID,
              snapshot: JSON.parse(fs.readFileSync(path.join(directory, "snapshot.json"), "utf8")),
              decision: JSON.parse(fs.readFileSync(path.join(directory, "decision.json"), "utf8")),
              onProgress: (message) => core.info(message),
            });
            fs.writeFileSync(path.join(directory, "merge.json"), JSON.stringify(result, null, 2));
            core.setOutput("merged", String(result.merged));
            if (result.merged) core.setOutput("merge_sha", result.merge_sha);
            await core.summary.addHeading(result.merged ? "Squash merge confirmed" : `No merge: ${result.status}`)
              .addCodeBlock(JSON.stringify(result, null, 2), "json").write();

      - name: Dispatch post-merge evaluation and publication
        id: publication
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v9
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { dispatchEvaluation } = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/trivial-pr-automerge.cjs"));
            const result = await dispatchEvaluation({
              github, event: context.payload, repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID, mergeSha: process.env.MERGE_SHA,
              snapshot: JSON.parse(fs.readFileSync("out/trivial-pr-automerge/snapshot.json", "utf8")),
            });
            fs.writeFileSync("out/trivial-pr-automerge/publication.json", JSON.stringify(result, null, 2));
            await core.summary.addHeading("Post-merge evaluation").addCodeBlock(result.reason).write();

      - name: Delete unchanged source branch after confirmed merge
        id: cleanup
        if: always() && steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v9
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { deleteSourceBranch } = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/trivial-pr-automerge.cjs"));
            const result = await deleteSourceBranch({
              github, event: context.payload, repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID, mergeSha: process.env.MERGE_SHA,
              snapshot: JSON.parse(fs.readFileSync("out/trivial-pr-automerge/snapshot.json", "utf8")),
            });
            fs.writeFileSync("out/trivial-pr-automerge/cleanup.json", JSON.stringify(result, null, 2));
            await core.summary.addHeading("Source branch cleanup").addCodeBlock(result.reason).write();

      - name: Report incomplete merge or post-merge work
        if: failure()
        env:
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          if [ "$MERGED" = "true" ]; then
            echo "The PR was merged, but cleanup or evaluation dispatch failed. Inspect the failed step before retrying that operation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merge readiness or confirmation failed. Inspect the failed step and live PR state; do not assume the PR was merged or retry blindly." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merge and cleanup evidence
        if: always() && steps.merge.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: trivial-pr-merge-${{ github.run_id }}
          path: out/trivial-pr-automerge/
          overwrite: true
          if-no-files-found: error
          retention-days: 14
