name: Evaluate Agents & Skills

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: evaluator/package-lock.json

      - name: Install dependencies
        working-directory: evaluator
        run: npm ci

      - name: Install Copilot CLI
        uses: ./.github/actions/setup-copilot-cli

      - name: Run evaluation
        id: run_eval
        working-directory: evaluator
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx tsx cli.ts evaluate \
            --directory "${{ github.workspace }}" \
            --json \
            2>eval_errors.txt | tee eval_results.jsonl
          echo "done"

      - name: Annotate results
        if: always()
        working-directory: evaluator
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ ! -f eval_results.jsonl ]; then
            echo "No results file found."
            exit 0
          fi

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            file=$(echo "$line" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const o=JSON.parse(d); process.stdout.write(o.fileName||''); } catch(e){} });")
            score=$(echo "$line" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const o=JSON.parse(d); process.stdout.write(String(o.score??'')); } catch(e){} });")
            reasoning=$(echo "$line" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const o=JSON.parse(d); process.stdout.write(o.reasoning||''); } catch(e){} });")

            [ -z "$file" ] && continue

            deep_link=$(FILE_NAME="$file" FEEDBACK="$reasoning" node -e '
              const appUrl = new URL("ghapp://session/new");
              appUrl.searchParams.set("repo", `${process.env.REPO_OWNER}/${process.env.REPO_NAME}`);
              appUrl.searchParams.set("mode", "plan");
              appUrl.searchParams.set("prompt", `create a plan for improving #${process.env.FILE_NAME} based on the feedback <feedback>${process.env.FEEDBACK}</feedback>`);
              const launcherUrl = new URL("https://github.com/copilot/app/launch");
              launcherUrl.searchParams.set("open", appUrl.toString());
              process.stdout.write(launcherUrl.toString());
            ')
            annotation_link=${deep_link//'%'/'%25'}

            # Determine severity: score < 5 = warning, otherwise notice
            if [ "$score" -lt 5 ] 2>/dev/null; then
              level="warning"
            else
              level="notice"
            fi

            echo "::${level} file=${file}::Score: ${score}/10 — ${reasoning} Open in GitHub Copilot: ${annotation_link}"
          done < eval_results.jsonl

      - name: Report evaluation errors
        if: always()
        working-directory: evaluator
        run: |
          if [ -s eval_errors.txt ]; then
            echo "::warning::Some evaluations encountered errors:"
            while IFS= read -r line; do
              echo "::warning::${line}"
            done < eval_errors.txt
          fi

      - name: Summary
        if: always()
        working-directory: evaluator
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ ! -s eval_results.jsonl ]; then
            echo "No evaluation results. No new SVG can be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Compute average score
          avg=$(node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('eval_results.jsonl','utf8').split('\n').filter(Boolean);
            const scores = lines.map(l => JSON.parse(l).score);
            if (scores.some(s => typeof s !== 'number' || !Number.isFinite(s) || s < 1 || s > 10)) {
              throw new Error('Invalid score in evaluation output.');
            }
            const avg = scores.reduce((a,b) => a+b, 0) / scores.length;
            process.stdout.write((Math.round(avg * 10) / 10).toString());
          ")

          score_emoji() {
            local s=$1
            if [ "$s" -le 4 ] 2>/dev/null; then echo "🔴"
            elif [ "$s" -le 6 ] 2>/dev/null; then echo "🟡"
            elif [ "$s" -le 8 ] 2>/dev/null; then echo "🟢"
            else echo "✅"
            fi
          }

          echo "## 📊 Evaluation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Evaluated commit: \`${SOURCE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Individual results below may be partial; publication requires a complete evaluation." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Score | Reasoning | Action |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            file=$(echo "$line" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const o=JSON.parse(d); process.stdout.write(o.fileName||''); } catch(e){} });")
            score=$(echo "$line" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const o=JSON.parse(d); process.stdout.write(String(o.score??'')); } catch(e){} });")
            reasoning=$(echo "$line" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const o=JSON.parse(d); process.stdout.write(o.reasoning||''); } catch(e){} });")
            [ -z "$file" ] && continue
            deep_link=$(FILE_NAME="$file" FEEDBACK="$reasoning" node -e '
              const appUrl = new URL("ghapp://session/new");
              appUrl.searchParams.set("repo", `${process.env.REPO_OWNER}/${process.env.REPO_NAME}`);
              appUrl.searchParams.set("mode", "plan");
              appUrl.searchParams.set("prompt", `create a plan for improving #${process.env.FILE_NAME} based on the feedback <feedback>${process.env.FEEDBACK}</feedback>`);
              const launcherUrl = new URL("https://github.com/copilot/app/launch");
              launcherUrl.searchParams.set("open", appUrl.toString());
              process.stdout.write(launcherUrl.toString());
            ')
            emoji=$(score_emoji "$score")
            echo "| \`${file}\` | ${emoji} **${score}/10** | ${reasoning} | [Open in GitHub Copilot](${deep_link}) |" >> "$GITHUB_STEP_SUMMARY"
          done < eval_results.jsonl

          avg_emoji=$(score_emoji "$(echo "$avg" | cut -d. -f1)")
          echo "|------|-------|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Average** | ${avg_emoji} **${avg}/10** | | |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate complete results and generate evaluation bundle
        id: generate_badge
        if: success()
        working-directory: evaluator
        run: |
          npx tsx publication.ts bundle \
            --directory "$GITHUB_WORKSPACE" \
            --input eval_results.jsonl \
            --output "$RUNNER_TEMP/evaluation-output"

      - name: Upload complete evaluation bundle
        id: upload_badge
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-output
          path: ${{ runner.temp }}/evaluation-output/
          if-no-files-found: error
          overwrite: true

      - name: Preserve evaluation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-diagnostics
          path: |
            evaluator/eval_results.jsonl
            evaluator/eval_errors.txt
          if-no-files-found: warn
          overwrite: true

      - name: Badge summary
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload_badge.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pages_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          badge_url="${pages_url%/}/evaluation/eval-badge.svg"
          if [ "$UPLOAD_OUTCOME" = "success" ]; then
            if [ "$SOURCE_REF" = "refs/heads/main" ]; then
              echo "Complete evaluation for \`${SOURCE_SHA}\`. Pages publishes it automatically after this run succeeds; the image below shows the latest published complete main evaluation." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Complete snapshot for \`${SOURCE_SHA}\`; non-main runs do not update the public image." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "**Evaluation was not published.** The last complete main SVG is unchanged. See the errors and [diagnostic evidence](${RUN_URL}#artifacts)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View the SVG directly](${badge_url})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![Latest complete main evaluation](${badge_url})" >> "$GITHUB_STEP_SUMMARY"
